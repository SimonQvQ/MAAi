name: Docker Hub Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mwu-web:
    name: Build MWU Web (page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11 --activate
      - name: Clone MWU
        run: git clone --depth 1 https://github.com/ravizhan/MWU.git mwu_src
      - name: Patch + build MWU web
        run: bash maai-server/mwu/build_mwu_web.sh maai-server/mwu mwu_src
      - name: Upload page artifact
        uses: actions/upload-artifact@v4
        with:
          name: mwu-page
          path: mwu_src/page
          retention-days: 7

  publish:
    name: Build & Push maai-server
    needs: build-mwu-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download page artifact
        uses: actions/download-artifact@v4
        with:
          name: mwu-page
          path: page
      - name: Resolve resource URLs
        run: |
          echo "MAA5_RES_URL=https://github.com/MaaAssistantArknights/MaaAssistantArknights/releases/download/v5.12.2/MAA-v5.12.2-win-x64.zip" >> "$GITHUB_ENV"
      - name: Clone MWU + patch backend
        run: |
          git clone --depth 1 https://github.com/ravizhan/MWU.git mwu_src
          python3 maai-server/mwu/patch_backend.py mwu_src maai-server/mwu
      - name: Prepare Docker context
        run: |
          mkdir -p ctx/page
          cp -r mwu_src ctx/mwu_src
          cp -r page/. ctx/page/
          cp maai-server/Dockerfile.mwu ctx/Dockerfile
          cp maai-server/fetch_official_resources.sh maai-server/convert_maares.py ctx/
          cp maai-server/mwu/interface.json ctx/interface.json
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ctx
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/maai-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/maai-server:${{ github.ref_name }}
          build-args: |
            MAAFW_URL=${{ secrets.MAAFW_URL }}
            MAA5_RES_URL=${{ secrets.MAA5_RES_URL || env.MAA5_RES_URL }}